<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skille: embeddingi i PCA</title>
<style>body{font:15px system-ui;margin:0;background:#f5f7fb;color:#1b2638}main{max-width:1350px;margin:auto;padding:24px}h1{margin-bottom:6px}p{line-height:1.5}a{color:#2357ae}button,input,select{font:inherit;padding:8px;border:1px solid #bec9d9;border-radius:6px;background:white}button{cursor:pointer}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.panel{background:white;border:1px solid #dce3ed;border-radius:10px;padding:16px;margin:14px 0}.plots{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart{position:relative;min-width:0}canvas{width:100%;height:480px;display:block;background:#fafbfe;border:1px solid #dce3ed;cursor:grab}.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.tip{display:none;position:fixed;z-index:5;background:#172132;color:white;padding:10px;border-radius:6px;max-width:360px;pointer-events:none;font-size:13px;box-shadow:0 4px 20px #0005}.scroll{overflow:auto;max-height:75vh}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e4e9f1;vertical-align:top}th{position:sticky;top:0;background:#f2f5fa}.muted{color:#536276;font-size:13px}.badge{border-radius:10px;padding:2px 6px;color:white;white-space:nowrap}.stats{display:flex;gap:18px;flex-wrap:wrap} @media(max-width:800px){.plots{grid-template-columns:1fr}canvas{height:390px}}</style></head>
<body><main><h1>1000 skilli: embeddingi i PCA</h1><p>Wariant 1: oryginalny tekst. Wariant 2: usunięte popularne słowa przed ucięciem tekstu. <a href="wykres-3d.html">Wykresy 3D</a> · <a href="porownanie.html">Porównanie skilli</a> · <a href="../gitskills-semantic-board/review-1000.html">Przegląd analiz</a></p><div id="intro" class="panel"></div><div id="content"></div></main><div class="tip" id="tip"></div>
<script>/* DATA */
/* MODE */
const R=DATA.report, S=DATA.skills, colors=['#2563eb','#d94841','#138b68','#9a52be','#e88a20','#187e98','#ce4992','#7a8833','#735744'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>(100*x).toFixed(1)+'%';
document.getElementById('intro').innerHTML=`<div class="stats"><span><b>${S.length}</b> skilli</span><span><b>${R.k}</b> grup na wariant</span><span>Wspólne PCA 3D: <b>${pct(R.pca_explained_variance_ratio.reduce((a,b)=>a+b,0))}</b> zmienności</span><span>Średnia wspólnych 10 sąsiadów: <b>${pct(R.neighbor_overlap_at_10)}</b></span><span>Ta sama dopasowana grupa: <b>${pct(R.unchanged_cluster_fraction)}</b></span></div><p class="muted">Grupy wyznacza k-means na pełnych embeddingach, nie PCA. Ich liczba (9) jest wyborem do eksploracji. Numery grup w wariancie 2 dopasowano do wariantu 1 według największej wspólnej liczby skilli; nie gwarantuje to jednakowego znaczenia grup. Słowa opisują grupy automatycznie i nie są nazwami domen. Wcześniejsze domeny są wstępne. Wspólne PCA policzono na obu zestawach, aby współrzędne były porównywalne.</p><p class="muted">Limit modelu: ${R.max_sequence_length} tokenów (w tym tokeny specjalne). Powyżej limitu przed ucięciem: ${R.over_limit[0]} / ${R.over_limit[1]} skilli; mediana długości: ${R.median_tokens[0]} / ${R.median_tokens[1]} tokenów. PCA: PC1 ${pct(R.pca_explained_variance_ratio[0])}, PC2 ${pct(R.pca_explained_variance_ratio[1])}, PC3 ${pct(R.pca_explained_variance_ratio[2])}.</p>`;
const content=document.getElementById('content');
function badge(n){return `<span class="badge" style="background:${colors[n-1]}">Grupa ${n}</span>`}
if(MODE==='plot'){
 content.innerHTML='<div class="panel"><b>Obsługa:</b> przeciągnij wykres, aby obrócić oba jednocześnie; kółko myszy zmienia przybliżenie. Najedź na punkt, aby zobaczyć wcześniejszą dziedzinę. <button id="reset">Resetuj widok</button></div><div class="plots">'+[0,1].map(i=>`<div class="panel chart"><h2>${i?'2. Bez stop-słów':'1. Oryginalny tekst'}</h2><canvas id="c${i}"></canvas><p class="muted">Osie: PC1, PC2, PC3. Kolor oznacza grupę embeddingów.</p><div class="legend">${R.keywords[i].map((w,j)=>`<div><span class="dot" style="background:${colors[j]}"></span><b>${j+1}</b> (${R.cluster_sizes[i][j]}): ${w.map(esc).join(', ')}</div>`).join('')}</div></div>`).join('')+'</div>';
 let yaw=.55,pitch=-.35,zoom=1, drag=null, points=[[],[]], canv=[document.getElementById('c0'),document.getElementById('c1')], tip=document.getElementById('tip');
 const max=Math.max(...S.flatMap(x=>x.coords.flatMap(v=>v.map(Math.abs))));
 function draw(i){let cv=canv[i], rect=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=rect.width*dpr;cv.height=rect.height*dpr;let ctx=cv.getContext('2d');ctx.scale(dpr,dpr);let w=rect.width,h=rect.height,scale=Math.min(w,h)*.35/max*zoom;
 function project(v){let [x,y,z]=v, X=x*Math.cos(yaw)-y*Math.sin(yaw),Y=x*Math.sin(yaw)+y*Math.cos(yaw), Z=z*Math.cos(pitch)-Y*Math.sin(pitch), depth=z*Math.sin(pitch)+Y*Math.cos(pitch);return [w/2+X*scale,h/2-Z*scale,depth]}
 let origin=project([0,0,0]); [[max*.8,0,0],[0,max*.8,0],[0,0,max*.8]].forEach((v,j)=>{let p=project(v);ctx.strokeStyle='#a5b2c4';ctx.beginPath();ctx.moveTo(...origin.slice(0,2));ctx.lineTo(...p.slice(0,2));ctx.stroke();ctx.fillStyle='#536276';ctx.fillText('PC'+(j+1),p[0]+3,p[1]-3)});
 points[i]=S.map((x,n)=>({p:project(x.coords[i]),n})).sort((a,b)=>a.p[2]-b.p[2]);for(let x of points[i]){ctx.beginPath();ctx.arc(x.p[0],x.p[1],3.8,0,Math.PI*2);ctx.fillStyle=colors[S[x.n].clusters[i]-1];ctx.globalAlpha=.8;ctx.fill()}ctx.globalAlpha=1;}
 function redraw(){draw(0);draw(1)}
 canv.forEach((cv,i)=>{cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);tip.style.display='none'});cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-drag[0])*.01;pitch+=(e.clientY-drag[1])*.01;drag=[e.clientX,e.clientY];redraw();return}let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=null,dist=9;for(let p of points[i]){let d=Math.hypot(p.p[0]-x,p.p[1]-y);if(d<dist){dist=d;hit=S[p.n]}}if(hit){tip.innerHTML=`<b>#${hit.number} ${esc(hit.repository)}</b><br>${esc(hit.path)}<br>Wcześniejsza dziedzina: <b>${esc(hit.domain)}</b><br>Grupa ${hit.clusters[i]}<br>${esc(hit.goal)}`;tip.style.display='block';tip.style.left=Math.min(e.clientX+15,innerWidth-380)+'px';tip.style.top=Math.min(e.clientY+15,innerHeight-120)+'px'}else tip.style.display='none'});cv.addEventListener('pointerleave',()=>tip.style.display='none');cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));redraw()},{passive:false})});document.getElementById('reset').onclick=()=>{yaw=.55;pitch=-.35;zoom=1;redraw()};window.addEventListener('resize',redraw);redraw();
}else{
 content.innerHTML='<div class="panel"><div class="bar"><input id="search" type="search" placeholder="Szukaj skilla, repozytorium, domeny…" size="38"><label><input type="checkbox" id="changed"> Tylko zmiana grupy</label><span id="count"></span></div><p class="muted">Grupy są wynikami klasteryzacji, nie przewidywaniami dziedzin. Liczba tokenów obejmuje cały przygotowany tekst przed ucięciem; model użył najwyżej 256.</p><div class="scroll"><table><thead><tr><th>Skill / repozytorium</th><th>Wcześniejsza dziedzina</th><th>1. Oryginał</th><th>2. Bez stop-słów</th><th>Tokeny 1 / 2</th></tr></thead><tbody id="rows"></tbody></table></div></div>';
 function render(){let q=document.getElementById('search').value.toLowerCase(),changed=document.getElementById('changed').checked, filtered=S.filter(x=>(!changed||x.clusters[0]!==x.clusters[1])&&[x.number,x.repository,x.path,x.domain,x.goal].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=filtered.length+' z '+S.length;document.getElementById('rows').innerHTML=filtered.map(x=>`<tr><td><b>#${x.number} ${esc(x.repository)}</b><br>${esc(x.path)}<br><span class="muted">${esc(x.goal)}</span></td><td>${esc(x.domain)}</td><td>${badge(x.clusters[0])}<br><span class="muted">${R.keywords[0][x.clusters[0]-1].slice(0,4).map(esc).join(', ')}</span></td><td>${badge(x.clusters[1])}<br><span class="muted">${R.keywords[1][x.clusters[1]-1].slice(0,4).map(esc).join(', ')}</span></td><td>${x.tokens.join(' / ')}</td></tr>`).join('')};document.getElementById('search').oninput=render;document.getElementById('changed').onchange=render;render();
}
</script></body></html>
